[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "taskml"
version = "0.1.0"
description = "TaskML (https://taskml.dev) parser, validator and serializer - Python bindings for the taskml C++ library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]

[project.scripts]
taskml-gantt = "taskml.gantt:main"

[project.urls]
Homepage = "https://taskml.dev"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.8"
wheel.packages = ["python/taskml"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
